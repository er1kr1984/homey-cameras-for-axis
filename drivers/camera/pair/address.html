<style>
  .ax-hint { font-size: 13px; opacity: .7; margin-top: 4px; }
  .ax-msg { margin: 12px 0; opacity: .8; }
  .ax-intro { margin-bottom: 16px; }
</style>

<header class="homey-header">
  <h1 class="homey-title" data-i18n="pair.addressTitle"></h1>
</header>
<p class="ax-intro" data-i18n="pair.addressIntro"></p>

<form class="homey-form" id="ax-addr-form">
  <div class="homey-form-group">
    <label class="homey-form-label" for="ax-addr-list" data-i18n="pair.addressLabel"></label>
    <input class="homey-form-input" id="ax-addr-list" type="text" placeholder="192.168.40.10, 192.168.40.11" inputmode="url" autocapitalize="none" autocorrect="off" spellcheck="false" />
    <p class="ax-hint" data-i18n="pair.addressHint"></p>
  </div>
  <button class="homey-button-primary-full" id="ax-addr-next" type="submit" data-i18n="pair.addressNext"></button>
</form>
<div class="ax-msg" id="ax-addr-msg"></div>

<script type="application/javascript">
  // In its own function: this page shares the global scope with Homey's pairing page
  // (which uses a global $), so nothing here may become a global.
  (function () {
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = Homey.__(el.dataset.i18n); });
    const byId = (id) => document.getElementById(id);

    byId('ax-addr-form').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      byId('ax-addr-next').disabled = true;
      try {
        await Homey.emit('addresses', { addresses: byId('ax-addr-list').value });
        byId('ax-addr-msg').textContent = Homey.__('pair.checking');
        Homey.showView('list_devices');
      } catch (e) {
        Homey.alert(e.message || String(e));
      } finally {
        byId('ax-addr-next').disabled = false;
      }
    });
  }());
</script>
