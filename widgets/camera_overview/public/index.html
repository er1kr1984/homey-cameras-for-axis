<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    [hidden] { display: none !important; }
    :root {
      --text: var(--homey-text-color, #1d1d1f);
      --muted: var(--homey-text-color-light, #8a8a8e);
      --line: var(--homey-line-color, rgba(127,127,127,.18));
      --chip: rgba(127,127,127,.12);
      --alert: #e5484d;
      --ok: #2fb86a;
      --font: var(--homey-font-family, -apple-system, system-ui, sans-serif);
    }
    html, body { margin: 0; background: transparent; color: var(--text); font: 13px/1.35 var(--font); }
    body { padding: 10px 12px; }
    .cam { padding: 8px 0 9px; border-bottom: 1px solid var(--line); }
    .cam:last-child { border-bottom: 0; }
    .row { display: flex; align-items: center; gap: 8px; }
    .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px rgba(47,184,106,.15); }
    .cam.off .dot { background: var(--muted); box-shadow: none; }
    .cam.alert .dot { background: var(--alert); box-shadow: 0 0 0 3px rgba(229,72,77,.18); animation: pulse 1.4s infinite; }
    .name { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nums { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 4px 0 0 16px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .nums b { color: var(--text); font-weight: 600; }
    .chips { display: flex; gap: 5px; flex-wrap: wrap; margin: 5px 0 0 16px; }
    .chip { padding: 1px 8px; border-radius: 999px; background: var(--chip); font-size: 11px; font-weight: 500; }
    .chip.on { background: rgba(229,72,77,.14); color: var(--alert); }
    .chip.problem { background: rgba(229,72,77,.14); color: var(--alert); }
    .last { margin: 4px 0 0 16px; color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .empty { color: var(--muted); font-size: 12px; padding: 4px 0; }
    @keyframes pulse { 50% { opacity: .4; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/javascript">
    function onHomeyReady(Homey) {
      const REFRESH_MS = 4000;
      const t = (k, v) => Homey.__(`widget.${k}`, v);
      const root = document.getElementById('root');
      let timer = null;

      const el = (tag, cls, text) => {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined) e.textContent = text;
        return e;
      };
      const ago = (ms) => {
        const min = Math.round((Date.now() - ms) / 60000);
        if (min < 1) return t('justNow');
        if (min < 60) return t('minAgo', { n: min });
        return t('hoursAgo', { n: Math.round(min / 60) });
      };

      function render(data) {
        root.textContent = '';
        if (!data.cameras.length) root.append(el('div', 'empty', t('noCameras')));
        const sorted = data.cameras.slice().sort((a, b) => (Number(b.motion || b.scenarios.some((s) => s.active)) - Number(a.motion || a.scenarios.some((s) => s.active)))
          || a.name.localeCompare(b.name));
        for (const c of sorted) {
          const busy = c.motion || c.tamper || c.scenarios.some((s) => s.active);
          const box = el('div', `cam${!c.available ? ' off' : ''}${busy || c.problem ? ' alert' : ''}`);
          const row = el('div', 'row');
          row.append(el('span', 'dot'), el('span', 'name', c.name));
          const nums = el('span', 'nums');
          const num = (value, label) => {
            const s = el('span');
            s.append(el('b', '', String(value)), document.createTextNode(` ${label}`));
            nums.append(s);
          };
          if (c.people !== null && c.people !== undefined) num(c.people, t(c.people === 1 ? 'person' : 'people'));
          if (c.vehicles !== null && c.vehicles !== undefined) num(c.vehicles, t(c.vehicles === 1 ? 'vehicle' : 'vehicles'));
          if (c.motionToday) num(c.motionToday, t('motionToday'));
          if (typeof c.noise === 'number') num(Math.round(c.noise), 'dB');
          for (const k of c.counters) if (k.total !== null && k.total !== undefined) num(k.total, k.name);
          box.append(row);
          if (nums.children.length) box.append(nums);
          const chips = el('div', 'chips');
          if (!c.available) chips.append(el('span', 'chip problem', t('offline')));
          if (c.problem) chips.append(el('span', 'chip problem', c.problem));
          if (c.motion) chips.append(el('span', 'chip on', t('motion')));
          for (const s of c.scenarios) if (s.active) chips.append(el('span', 'chip on', s.name));
          if (c.watched) chips.append(el('span', 'chip', t('watched')));
          if (chips.children.length) box.append(chips);
          if (c.recent.length) box.append(el('div', 'last', `${c.recent[0].text} · ${ago(c.recent[0].time)}`));
          root.append(box);
        }
        try { Homey.setHeight(document.body.scrollHeight); } catch (e) { /* older Homey */ }
      }

      async function refresh() {
        clearTimeout(timer);
        if (document.hidden) return;
        try {
          render(await Homey.api('GET', '/overview'));
        } catch (err) {
          root.textContent = (err && err.message) || String(err);
        }
        timer = setTimeout(refresh, REFRESH_MS);
      }

      document.addEventListener('visibilitychange', () => (document.hidden ? clearTimeout(timer) : refresh()));
      refresh().then(() => Homey.ready());
    }
  </script>
</body>
</html>
